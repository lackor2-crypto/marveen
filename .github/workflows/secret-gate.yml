name: secret-gate

# Miert van ez a fajl?
#   2026-07-22-en (az upstream projektben, Szotasz/marveen) egy ElevenLabs
#   API-kulcs bekerult egy PUBLIKUS repoba egy commitban. Az upstream erre
#   epitett egy sajat scripts/secret-gate.ts scannert es egy hozza tartozo CI-
#   lepest -- ez a repo egy rovid ideig (2026-08-23, egy behuzott es meg aznap
#   visszavont upstream-merge reven) tartalmazta is, majd a revert (7ae7b42)
#   veletlenul elvitte innen is.
#
#   Ez a fajl EGY ONALLO, fuggetlen ujraepites: nem hasznalja a mar nem
#   letezo scripts/secret-gate.ts-t, nem hoz be kulso GitHub Actiont vagy uj
#   npm-fuggoseget -- csak grep-re epul, mint a helyi pre-commit git-guard
#   hook. A pre-commit hook --no-verify-vel kihagyhato; EZ a lepes nem.
#
#   MERVE 2026-08-30: ellenoriztem, hogy a konkret elszivargott commit
#   (48638cb6) NEM letezik ebben a forkban, es szelesebb keresessel sem
#   talalhato valodi kulcs-alaku string sem az elerheto, sem az el nem erheto
#   git-objektumok kozott. Ez a lepes az UTANI valtozasokat vedi.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Kulcs-minta ellenorzes a valtozott sorokban
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A valtozott sorok kigyujtese
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
            git diff "$RANGE" -- . ':!.github/workflows/secret-gate.yml' > /tmp/diff.txt
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              echo "uj ag vagy elso push -- csak az utolso commitot nezzuk"
              git show "${{ github.sha }}" -- . ':!.github/workflows/secret-gate.yml' > /tmp/diff.txt
            else
              git diff "$BEFORE..${{ github.sha }}" -- . ':!.github/workflows/secret-gate.yml' > /tmp/diff.txt
            fi
          fi
          grep -E '^\+[^+]' /tmp/diff.txt > /tmp/added.txt || true
          echo "vizsgalando sorok szama: $(wc -l < /tmp/added.txt)"

      - name: Gyakori kulcs-mintak keresese
        run: |
          set -euo pipefail
          printf '%s\n' \
            'AKIA[0-9A-Z]{16}' \
            'gh[pousr]_[A-Za-z0-9]{36,}' \
            'sk-[A-Za-z0-9]{20,}' \
            'xox[baprs]-[A-Za-z0-9-]{10,}' \
            'BEGIN[A-Z ]*PRIVATE KEY' \
            '[Aa][Pp][Ii][_-]?[Kk][Ee][Yy][^A-Za-z0-9]{0,6}[A-Za-z0-9_/+=]{24,}' \
            '[A-Z_]{3,}(KEY|TOKEN|SECRET)[^A-Za-z0-9]{0,6}[A-Za-z0-9_/+=-]{24,}' \
            > /tmp/patterns.txt

          if grep -EnIf /tmp/patterns.txt /tmp/added.txt; then
            echo "::error::Kulcs-alaku string kerult a valtozasba (a fenti sorokban). Ha VALODI kulcs: vond vissza AZONNAL a szolgaltatonal -- a git tortenetbol torles NEM eleg, ha a commit mar publikus repoba kerult. Ha alriadas (pl. teszt-fixture vagy alacsony-entropiaju pelda-string), nyilvanvaloan alkulcs formaban ird at."
            exit 1
          fi
          echo "OK: nincs ismert kulcs-minta a valtozott sorokban."
