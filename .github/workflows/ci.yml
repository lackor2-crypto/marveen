name: CI

# Miert van ez a fajl?
#   A teljes teszt-suite eddig KIZAROLAG a fejlesztoi gepen futott, a push
#   pillanataban (pre-push hook). Egy masik gep, egy masik Node-verzio vagy egy
#   idegen hozzajarulas kodja soha nem lett megmerve. Ez a workflow ugyanazt a
#   kaput lefuttatja egy URES, FRISS gepen -- vagyis pontosan azt az allapotot
#   meri, amit a projekt alapszabalya megkovetel: "frissen telepitett
#   Marveenben is mukodjon".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Egy agra egyszerre egy futas eleg: az ujabb push leallitja a regebbit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# A legszukebb jog, amivel a munka elvegezheto: csak olvasas.
permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # A package.json engines mezoje: ">=20.19.0 <24". Mind a ket
        # veghatart merjuk, kulonben csak arrol tudunk, amit a fejlesztoi gep
        # eppen hasznal (.nvmrc = 22).
        #
        # On a PULL REQUEST both ends run. On the push to main that follows the
        # merge only the development version (22) runs again: the same commits
        # were just measured on both, and repeating the whole matrix there was
        # half of the Actions usage GitHub switched this fork's workflows off
        # for (2026-10-09, owner decision "B", card #519).
        node: ${{ fromJSON(github.event_name == 'push' && '["22"]' || '["20.19","22"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      # A fejlesztoi gepen (WSL) van ffmpeg, ezert a fenykepek-racs bolyegkep-
      # tesztjei ott zoldek. MERT: 2026-08-30, elso eles CI-futas -- a
      # futtatogepen NEM volt ffmpeg, "spawn ffmpeg ENOENT" 5 tesztet buktatott.
      # A termek maga ffmpeg nelkul is mukodik (teljes meretu kepre esik
      # vissza), de a bolyegkep-viselkedest csak ffmpeg-gel lehet leellenorizni.
      # 1/A (#441): a Munkapad iratolvasoja (pdftotext + tesseract) valodi PDF-en is tesztelve.
      # 1/A (#441): a dokumentummodell PDF-je (LibreOffice) valodi PDF-en merve: nincs benne forras (K-1.13), a vegleges PDF/A.
      #
      # WHY THE .deb CACHE (#456, measured 2026-10-01): this install is 145
      # packages / 170 MB, mostly LibreOffice, pulled from the runner's apt
      # mirror on EVERY run. With a slow mirror (~150 kB/s on PR #642: the 43 MB
      # libreoffice-core did not arrive in 3m45s) the download alone used up the
      # whole job budget -- the job was CANCELLED and the tests never started.
      # 7 runs hit the job's time limit inside this very step that day. So:
      #   1. the .deb files are kept between runs (apt verifies each cached file
      #      against the signed index, and only fetches what is missing or newer);
      #   2. the download runs on its own clock and fails with a spoken reason
      #      instead of a silent "cancelled";
      #   3. whatever did arrive is saved even then, so a re-run resumes instead
      #      of starting from zero.
      - name: apt cache key
        id: aptkey
        run: echo "prefix=apt-debs-v1-$(. /etc/os-release && echo "${ID}${VERSION_ID}")-$(dpkg --print-architecture)" >> "$GITHUB_OUTPUT"

      # The real key is a hash of the .deb set, known only AFTER the install, so
      # the exact key below never hits on purpose: the newest cache with the
      # prefix is restored (this branch first, then main). A COMPLETE set wins
      # over a partial one whatever their age -- measured on PR #645: the slow
      # job saved its partial set 7 minutes AFTER the fast job saved the full
      # one, and "newest first" alone would have handed out the partial set.
      - name: apt cache restore
        id: aptrestore
        uses: actions/cache/restore@v4
        with:
          path: /tmp/marveen-apt-archives
          key: ${{ steps.aptkey.outputs.prefix }}-full-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.aptkey.outputs.prefix }}-full-
            ${{ steps.aptkey.outputs.prefix }}-partial-

      - name: ffmpeg telepitese
        id: aptinstall
        env:
          APT_ARCHIVES: /tmp/marveen-apt-archives
          APT_PACKAGES: ffmpeg poppler-utils tesseract-ocr tesseract-ocr-hun tesseract-ocr-deu libreoffice-writer-nogui fonts-liberation
        run: |
          mkdir -p "$APT_ARCHIVES"
          sudo apt-get update -qq
          # Download only, bounded: 8 minutes is what the job budget can spare
          # and still finish the suite (~5.5 minutes after this step). Killing a
          # pure download is safe; killing a half-done dpkg run would not be,
          # hence the two separate calls.
          rc=0
          sudo timeout --kill-after=30s 8m apt-get install -y --no-install-recommends --download-only \
            -o Dir::Cache::Archives="$APT_ARCHIVES" $APT_PACKAGES || rc=$?
          if [ "$rc" -ne 0 ]; then
            megvan="$(find "$APT_ARCHIVES" -maxdepth 1 -name '*.deb' | wc -l)"
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              echo "::error::Az apt-csomagok letoltese 8 perc alatt nem ert veget (lassu csomagtukor) -- ez NEM teszt-hiba, a tesztek el sem indultak. Eddig $megvan csomag jott le; ezeket a kovetkezo lepes menti el, igy az ujrafuttatas onnan folytatja."
            else
              echo "::error::Az apt-csomagok letoltese hibaval allt meg (apt-get exit $rc) -- ez NEM teszt-hiba, a tesztek el sem indultak. A pontos ok a lepes naplojaban, az apt sajat uzeneteben all."
            fi
            exit 1
          fi
          # Everything is local now: this part does not touch the network.
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$APT_ARCHIVES" $APT_PACKAGES

      # Runs after a failed download too (always()), so partial progress is kept.
      # The key is the content: an unchanged set of files is not saved again.
      - name: apt cache state
        id: aptstate
        if: always()
        env:
          APT_ARCHIVES: /tmp/marveen-apt-archives
        run: |
          [ -d "$APT_ARCHIVES" ] || exit 0
          # Drop superseded versions, or the cache would only ever grow.
          sudo apt-get autoclean -qq -o Dir::Cache::Archives="$APT_ARCHIVES" || true
          sudo rm -f "$APT_ARCHIVES/lock"
          sudo chown -R "$(id -u):$(id -g)" "$APT_ARCHIVES"
          [ -n "$(find "$APT_ARCHIVES" -type f -print -quit)" ] || exit 0
          hash="$(cd "$APT_ARCHIVES" && find . -type f -printf '%P %s\n' | LC_ALL=C sort | sha256sum | cut -c1-16)"
          # "full" only if the install step itself finished: see the restore order.
          kind="${{ steps.aptinstall.outcome == 'success' && 'full' || 'partial' }}"
          echo "key=${{ steps.aptkey.outputs.prefix }}-$kind-$hash" >> "$GITHUB_OUTPUT"

      - name: apt cache save
        if: always() && steps.aptstate.outputs.key != '' && steps.aptstate.outputs.key != steps.aptrestore.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: /tmp/marveen-apt-archives
          key: ${{ steps.aptstate.outputs.key }}

      # A teszt-suite megtagadja a futast, ha eles telepitesben talalja magat.
      # Egy CI checkoutban ennek sosem szabad bekovetkeznie -- de ha megis, a
      # hibauzenet legyen KIMONDOTT, ne egy rejtelyes "REFUSING TO RUN TESTS".
      - name: Guard - a checkout nem lehet eles telepites
        run: |
          hiba=0
          for m in store/.dashboard-token store/claudeclaw.db .env; do
            if [ -e "$m" ]; then
              echo "::error::A CI checkoutban ott van a(z) '$m' -- ez eles telepites nyoma. A suite ilyenkor nem fut le, es a zold pipa NEM jelentene semmit."
              hiba=1
            fi
          done
          [ "$hiba" -eq 0 ] && echo "OK: a checkout tiszta, a tesztek valoban lefutnak."
          exit $hiba

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Syntax check (web/)
        run: npm run syntax-check

      - name: Teszt-suite (vitest run)
        run: npm test

  # Aggregalt, STABIL nevu zaro kapu. A branch protection EZT jelolje required
  # status check-nek a matrix-fuggo "Node 20.19" / "Node 22" nevek helyett: azok
  # a `test` job matrixabol (node-verziok) szarmaznak, tehat ha a matrix valtozik
  # (verzio csere/hozzaadas), a regi nevu required check TOBBE nem regisztral, es
  # enforce_admins=true mellett a PR OROKRE mergelhetetlen -- admin sem tudja
  # feluliratni. Ez a job neve fix ("ci-passed"), tehat a matrix szabadon
  # valtozhat. Push-ra ES pull_request-re is fut (a workflow triggerei), es
  # `if: always()` + a `needs.test.result` ellenorzes miatt PIROS, ha barmelyik
  # matrix-ag nem 'success'. Kartya 7e82036c (kapcs. 61a83b22).
  ci-passed:
    name: ci-passed
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: A test matrix eredmenye
        run: |
          echo "test job result: ${{ needs.test.result }}"
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::A teljes teszt-matrix nem 'success' (eredmeny: ${{ needs.test.result }}) -- a CI piros, a merge blokkolt."
            exit 1
          fi
          echo "OK: a teljes teszt-matrix zold (PR-en Node 20.19 ES 22, a main push-on Node 22)."
